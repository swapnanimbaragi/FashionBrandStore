<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>AI Fashion Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <div class="container">

        <div class="login-box">

            <h1>Create Account</h1>

            <p>Join AI Fashion Platform</p>

            <form onsubmit="registerUser(event)">

                <input type="text"
                id="name"
                placeholder="Enter Full Name"
                required>

                <input type="email"
                id="email"
                placeholder="Enter Email"
                required>

                <input type="text"
                id="phone"
                placeholder="Enter Phone Number"
                required>

                <input type="text"
                id="address"
                placeholder="Enter Address"
                required>

                <input type="password"
                id="password"
                placeholder="Enter Password"
                required>

                <input type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required>

                <button type="submit">

                    Register

                </button>

                <div class="links">

                    <a href="login.html">

                        Already have account?

                    </a>

                </div>

            </form>

        </div>

    </div>

<script>

async function registerUser(event){

    event.preventDefault();

    let name =
    document.getElementById("name").value;

    let email =
    document.getElementById("email").value;

    let phone =
    document.getElementById("phone").value;

    let address =
    document.getElementById("address").value;

    let password =
    document.getElementById("password").value;

    let confirmPassword =
    document.getElementById("confirmPassword").value;

    if(password !== confirmPassword){

        alert("Passwords do not match");

        return;

    }

    let formData = new URLSearchParams();

    if(name.length < 3)
    {

        alert("Name must contain minimum 3 letters");

        return;

    }

    if(!email.includes("@gmail.com")){

        alert("Enter valid Gmail");

        return;

    }

    if(phone.length != 10){

        alert("Phone number must contain 10 digits");

        return;

    }

    if(address.length < 5){

        alert("Enter proper address");

        return;

    }

    if(password.length < 4){

        alert("Password must contain minimum 4 characters");

        return;

    }

    if(password !== confirmPassword){

        alert("Passwords do not match");

        return;

    }

    formData.append("name", name);

    formData.append("email", email);

    formData.append("password", password);

    formData.append("phone", phone);

    formData.append("address", address);

    try{

        let response = await fetch(
        "http://localhost:8080/AiFashionStore/register",

        {

            method:"POST",

            headers:{
                "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:formData

        });

        let result = await response.text();

        if(result.includes("Successful")){

            alert("Registration Successful");

            window.location.href =
            "login.html";

        }

        else{

            alert("Registration Failed");

        }

    }

    catch(error){

        alert("Server Error");

        console.log(error);

    }

}

</script>

</body>
</html>
