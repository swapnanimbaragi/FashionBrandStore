<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="home-page">

<!-- NAVBAR -->

<nav class="navbar">

    <h1>Fashion-BrandStore</h1>

    <ul>

        <li><a href="homepage.html">Home</a></li>

        <li><a href="homepage.html">Brands</a></li>

        <li><a href="wishlist.html">Wishlist</a></li>

        <li><a href="cart.html">Cart</a></li>

        <li><a href="profile.html">Profile</a></li>

        <li><a href="login.html">Logout</a></li>

    </ul>

</nav>



<!-- PAGE TITLE -->

<section class="search-section">

    <h2>Shopping Cart</h2>

    <p>Your selected products appear here.</p>

</section>



<!-- DYNAMIC CART PRODUCTS -->

<section class="categories" id="cartContainer"></section>



<!-- TOTAL SECTION -->

<section class="search-section">

    <h2>Total Amount</h2>

    <p id="totalPrice"></p>

    <a href="checkout.html">

        <button>

            Proceed To Checkout

        </button>

    </a>

</section>



<!-- CART SCRIPT -->

<script>

let cartName =
localStorage.getItem("cartName");

let cartImage =
localStorage.getItem("cartImage");

let cartPrice =
localStorage.getItem("cartPrice");



let cartContainer =
document.getElementById("cartContainer");



if(cartName){

    cartContainer.innerHTML = `

        <div class="product-card">

            <img src="${cartImage}">

            <h3>
                ${cartName}
            </h3>

            <p class="price">
                ${cartPrice}
            </p>

            <p>
                ⭐ 4.8
            </p>

            <p class="offer">
                Special Offer Available
            </p>

            <div class="product-buttons">

                <a href="checkout.html">

                    <button>

                        Buy Now

                    </button>

                </a>

                <button
                class="wishlist-btn"
                onclick="clearCart()">

                    Remove

                </button>

            </div>

        </div>

    `;



    document.getElementById("totalPrice")
    .innerText = cartPrice;

}

else{

    cartContainer.innerHTML = `

        <h2 style="color:white;
        width:100%;
        text-align:center;">

            Cart is Empty

        </h2>

    `;

}



function clearCart(){

    localStorage.removeItem("cartName");

    localStorage.removeItem("cartImage");

    localStorage.removeItem("cartPrice");

    location.reload();

}

</script>

</body>
</html>
