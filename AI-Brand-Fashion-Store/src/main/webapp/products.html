    productList.push({
        name: productNames[category][i - 1],
        image: imageLinks[category][brand][i - 1],
        price: prices[category] + i * 500
    });

}

displayProducts(productList);

function displayProducts(products){

    container.innerHTML = "";

    products.forEach(function(product, index){

        let imgPath = product.image;

        container.innerHTML += `

            <div class="product-card">

                <img src="${imgPath}" alt="${brand} Product">

                <h3 onclick="openProduct(
                    '${brand} ${product.name}',
                    '${imgPath}',
                    '₹${product.price}'
                )">
                    ${brand} ${product.name}
                </h3>

                <p class="price">
                    ₹${product.price}
                </p>

                <p>
                    ⭐ 4.${index % 5}
                </p>

                <p class="stock-status 
                    ${index % 5 === 0 ? 'out-stock' : index % 3 === 0 ? 'few-stock' : 'in-stock'}">

                    ${index % 5 === 0 ? 'Out Of Stock' : index % 3 === 0 ? 'Few Left' : 'In Stock'}

                </p>

                <select class="size-select">

                ${category === "shoes" ? `

                    <option>Select Size</option>
                    <option>6 UK</option>
                    <option>7 UK</option>
                    <option>8 UK</option>
                    <option>9 UK</option>
                    <option>10 UK</option>

                ` : category === "watches" ? `

                    <option>Select Strap</option>
                    <option>Leather</option>
                    <option>Metal</option>
                    <option>Silicone</option>

                ` : category === "makeup" ? `

                    <option>Select Shade</option>
                    <option>Light</option>
                    <option>Medium</option>
                    <option>Dark</option>
                    <option>Nude</option>

                ` : `

                    <option>Select Size</option>
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>

                `}

                </select>

                <div class="product-info">

                    <p>✅ Cash On Delivery Available</p>
                    <p>✅ Online Payment Available</p>
                    <p>✅ 7 Days Return Policy</p>
                    <p>🚚 Free Delivery</p>
                    <p>⭐ Premium Quality Product</p>
                    <p>🚚 Delivery in 4-6 Days</p>

                </div>

                <div class="product-buttons">

                    <button onclick="addToCart(
                        '${brand} ${product.name}',
                        '${imgPath}',
                        '₹${product.price}'
                    )">
                        Add to Cart
                    </button>

                    <button class="wishlist-btn" onclick="addToWishlist(
                        '${brand} ${product.name}',
                        '${imgPath}',
                        '₹${product.price}'
                    )">
                        Wishlist
                    </button>

                </div>

            </div>
        `;

    });

}
function searchProducts(){

    let searchValue =
    document.getElementById("searchInput")
    .value.toLowerCase();

    let filteredProducts =
    productList.filter(function(product){

        return (
            (brand + " " + product.name)
            .toLowerCase()
            .includes(searchValue)
        );

    });

    displayProducts(filteredProducts);

}

function sortProducts(){

    let value = document.getElementById("sortSelect").value;

    if(value === "low"){
        productList.sort(function(a,b){
            return a.price - b.price;
        });
    }

    else if(value === "high"){
        productList.sort(function(a,b){
            return b.price - a.price;
        });
    }

    displayProducts(productList);
}

function openProduct(name, image, price){

    localStorage.setItem("detailName", name);
    localStorage.setItem("detailImage", image);
    localStorage.setItem("detailPrice", price);

    window.location.href = "product-details.html";
}

function addToCart(name, image, price){

    let cartItems = JSON.parse(localStorage.getItem("cartItems")) || [];

    let product = {
        name: name,
        image: image,
        price: price
    };

    cartItems.push(product);

    localStorage.setItem("cartItems", JSON.stringify(cartItems));

    showCartToast("🛒 Product added to cart");
}

function addToWishlist(name, image, price){

    localStorage.setItem("wishName", name);
    localStorage.setItem("wishImage", image);
    localStorage.setItem("wishPrice", price);

    showToast("❤️ Product added to wishlist");
}

function showToast(message){

    let toast = document.createElement("div");

    toast.className = "toast";

    toast.innerText = message;

    document.body.appendChild(toast);

    setTimeout(function(){
        toast.remove();
    },2500);
}

function showCartToast(message){

    let toast = document.createElement("div");

    toast.className = "cart-toast";

    toast.innerText = message;

    document.body.appendChild(toast);

    setTimeout(function(){
        toast.remove();
    },2500);
}

</script>
<script>

function toggleTheme(){

    document.body.classList.toggle("light-mode");

    if(document.body.classList.contains("light-mode")){

        localStorage.setItem("theme","light");

    }

    else{

        localStorage.setItem("theme","dark");

    }

}

if(localStorage.getItem("theme") === "light"){

    document.body.classList.add("light-mode");

}

</script>
